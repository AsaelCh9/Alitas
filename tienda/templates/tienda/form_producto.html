{% extends 'tienda/base.html' %}
{% block content %}
<div class="max-w-lg mx-auto bg-white border border-stone-200 rounded-2xl p-8">
    <h1 class="text-2xl font-light tracking-tight mb-6">{{ titulo }}</h1>
    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-xs font-medium text-stone-700 mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<p class="text-xs text-red-600 mt-1">{{ field.errors.0 }}</p>{% endif %}
        </div>
        {% endfor %}
        <div class="pt-4 flex justify-end gap-3 border-t border-stone-100">
            <a href="{% url 'lista_productos' %}" class="text-xs text-stone-500 px-4 py-2.5">Cancelar</a>
            <button type="submit" class="bg-stone-900 hover:bg-orange-600 text-white text-xs font-medium px-6 py-2.5 rounded-xl transition">Guardar</button>
        </div>
    </form>
</div>
{% endblock %}
