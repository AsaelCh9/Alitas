{% extends 'tienda/base.html' %}

{% block content %}
<div class="max-w-lg mx-auto bg-white border border-stone-200 rounded-2xl p-8">
    <div class="mb-6">
        <p class="text-xs uppercase tracking-widest text-orange-600 font-semibold mb-1">Administración</p>
        <h1 class="text-2xl font-light tracking-tight text-stone-900">Agregar platillo con foto</h1>
    </div>

    <!-- enctype="multipart/form-data" permite subir la imagen -->
    <form method="POST" enctype="multipart/form-data" class="space-y-5">
        {% csrf_token %}
       
        <div>
            <label class="block text-xs font-medium text-stone-700 mb-1.5">Nombre del producto</label>
            {{ form.nombre }}
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-medium text-stone-700 mb-1.5">Precio ($)</label>
                {{ form.precio }}
            </div>
            <div>
                <label class="block text-xs font-medium text-stone-700 mb-1.5">Categoría</label>
                {{ form.categoria }}
            </div>
        </div>

        <div>
            <label class="block text-xs font-medium text-stone-700 mb-1.5">Descripción</label>
            {{ form.descripcion }}
        </div>

        <div>
            <label class="block text-xs font-medium text-stone-700 mb-1.5">Fotografía del platillo</label>
            {{ form.imagen }}
        </div>

        <div class="pt-4 flex items-center justify-end gap-3 border-t border-stone-100">
            <a href="{% url 'inicio' %}" class="text-xs text-stone-500 hover:text-stone-900 px-4 py-2.5 transition">
                Cancelar
            </a>
            <button type="submit" class="bg-stone-900 hover:bg-orange-600 text-white text-xs font-medium px-6 py-2.5 rounded-xl transition">
                Guardar Platillo
            </button>
        </div>
    </form>
</div>
{% endblock %}
